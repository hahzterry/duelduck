info:
  contact: {}
  description: This is a swagger specification for a Duel Duck back-end.
  title: Duel Duck Prediction API
  version: "1.0"
paths:
  /admin/commission/dd-profit/claim:
    post:
      description: Triggers a payout of all accumulated platform-side commission (DD
        profit) for completed billing periods. Requires admin permissions.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Created DD profit claim record
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.ProjectCommissionClaim'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Claim platform DD profit (admin)
      tags:
      - admin
  /admin/commission/dd-profit/history:
    get:
      description: Returns the full history of platform DD profit claims. Requires
        admin permissions.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of DD profit claim records
          schema:
            items:
              $ref: '#/definitions/dd-prediction-api_internal_model.ProjectCommissionClaim'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Get DD profit claim history (admin)
      tags:
      - admin
  /admin/duel:
    post:
      consumes:
      - application/json
      description: Creates a new crypto duel as an admin. The duel is immediately
        set to active status, bypassing the approval step. The action is recorded
        in the audit log.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Duel creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.CreateDuelReq'
      produces:
      - application/json
      responses:
        "200":
          description: Created duel
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.Duel'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Create a crypto duel (admin)
      tags:
      - admin
  /admin/duel/approve:
    put:
      consumes:
      - application/json
      description: Approves a pending crypto duel, making it visible and open for
        participants. The action is recorded in the audit log.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Duel approve request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.DuelApproveReq'
      produces:
      - application/json
      responses:
        "200":
          description: Approved duel
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.Duel'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Approve a crypto duel (admin)
      tags:
      - admin
  /admin/duel/cancel:
    put:
      consumes:
      - application/json
      description: Cancels a crypto duel and initiates refunds to all participants.
        The action is recorded in the audit log.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Duel cancel request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.DuelCancelReq'
      produces:
      - application/json
      responses:
        "200":
          description: Refund transaction hashes
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.CancelCryptoDuelResp'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Cancel a crypto duel (admin)
      tags:
      - admin
  /admin/duel/edit:
    put:
      consumes:
      - application/json
      description: Updates editable fields of an existing duel (question, source of
        truth, logo URL, duel info, deadline). The action is recorded in the audit
        log.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Duel edit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.DuelAdminEditReq'
      produces:
      - application/json
      responses:
        "200":
          description: Duel updated successfully
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Edit a duel (admin)
      tags:
      - admin
  /admin/duel/resolve:
    put:
      consumes:
      - application/json
      description: Resolves a crypto duel by setting the winning answer and distributing
        rewards to winners. The action is recorded in the audit log.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Duel resolve request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.DuelResolveReq'
      produces:
      - application/json
      responses:
        "200":
          description: Transaction hashes and resolved duel
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.ResolveCryptoDuelResp'
        "400":
          description: Invalid request data
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Resolve a crypto duel (admin)
      tags:
      - admin
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the user's JWT tokens using the provided refresh token
        from the Authorization header. Returns a new pair of access and refresh tokens.
      parameters:
      - default: Bearer <refresh_token>
        description: Bearer refresh token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully refreshed tokens
          schema:
            properties:
              jwt_info:
                $ref: '#/definitions/dd-prediction-api_pkg_jwt.TokenPair'
            type: object
        "401":
          description: Unauthorized - Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Refresh JWT tokens
      tags:
      - auth
  /auth/send-code:
    post:
      consumes:
      - application/json
      description: Sends a verification code to the specified email address. The code
        is required for email-based sign-in or sign-up.
      parameters:
      - description: Email address to send the verification code to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.SendCode'
      produces:
      - application/json
      responses:
        "200":
          description: Verification code sent successfully
        "400":
          description: Invalid request data or email format
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
