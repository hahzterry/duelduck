        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project disabled
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Forbidden — project is admin-blocked
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Disable partner project
      tags:
      - project
  /me/project/enable:
    put:
      description: Restores a partner-disabled project to active status. Does not
        affect admin-blocked projects.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project enabled
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Forbidden — project is admin-blocked
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Re-enable partner project
      tags:
      - project
  /me/project/permissions:
    put:
      consumes:
      - application/json
      description: Enables or disables duel creation and self-resolve for users of
        this project's site. Self-resolve is automatically disabled when duel creation
        is disabled.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Permission flags
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dd-prediction-api_internal_model.UpdateProjectPermissionsReq'
