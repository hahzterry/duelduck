      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Project API key
        in: header
        name: X-API-Key
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daily income list
          schema:
            items:
              $ref: '#/definitions/dd-prediction-api_internal_model.PartnerDailyIncome'
            type: array
        "400":
