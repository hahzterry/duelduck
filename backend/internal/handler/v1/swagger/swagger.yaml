      - description: Filter OR condition
        in: query
        name: opts.filters[0].where_or
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of duels belonging to the authenticated user
          schema:
            items:
              $ref: '#/definitions/dd-prediction-api_internal_model.DuelShow'
            type: array
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Authentication required or invalid token
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Get my duels
      tags:
      - duel
  /duel/participating:
    get:
      consumes:
      - application/json
      description: Get all duels where the authenticated user is a participant, with
        optional filtering, sorting and pagination.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 10
        description: Number of items per page
        in: query
        name: opts.pagination.page_size
        type: integer
      - default: 1
        description: Page number (starting from 1)
        in: query
        name: opts.pagination.page_num
        type: integer
      - default: created_at
        description: Field to order by
        in: query
        name: opts.order.order_by
        type: string
      - default: '""'
        description: Order type
        enum:
        - desc
        - asc
        in: query
        name: opts.order.order_type
        type: string
      - description: First filter column name
        in: query
        name: opts.filters[0].column
        type: string
      - description: First filter operator
        in: query
        name: opts.filters[0].operator
        type: string
      - description: First filter value
        in: query
        name: opts.filters[0].value
        type: string
      - description: First filter OR condition
        in: query
        name: opts.filters[0].where_or
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of duels
          schema:
            items:
              $ref: '#/definitions/dd-prediction-api_internal_model.DuelShow'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized - Invalid or missing claims
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Get all duels where the user is a participant
      tags:
      - duel
  /duel/public/{id}:
