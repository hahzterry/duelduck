        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Duel details
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.Duel'
        "400":
          description: Invalid duel ID
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "404":
          description: Duel not found
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      summary: Get duel by ID (public)
      tags:
      - duel
  /me/analytics/daily-income:
    get:
      description: 'Returns daily commission income (USDC equivalent) for the partner''s
        project within a date range. Query params: from, to (format: 2006-01-02).
        Defaults to current month.'
