      tags:
      - project
    post:
      description: Creates a new project for the authenticated partner. Returns the
        project with its generated API key. One project per partner.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Created project
          schema:
            $ref: '#/definitions/dd-prediction-api_internal_model.Project'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
