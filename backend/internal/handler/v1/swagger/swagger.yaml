        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Partner permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
