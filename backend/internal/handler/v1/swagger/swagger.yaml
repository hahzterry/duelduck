            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "403":
          description: Admin permission required
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dd-prediction-api_pkg_apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Unblock a project's API key (admin)
      tags:
      - project
